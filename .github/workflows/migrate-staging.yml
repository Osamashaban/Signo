name: Migrate staging database

# Applies new files in db/migrations to the Neon `staging` branch, which
# every preview deployment reads. Never production.
#
# Runs by itself on a pull request that adds or changes migrations (so its
# preview has its tables before review, PIPELINE.md step 8) and again when
# they reach main. It can also be started by hand: Actions -> "Migrate
# staging database" -> Run workflow -> pick the branch.
#
# Secret: STAGING_DATABASE_URL_UNPOOLED (Neon `staging`, direct connection).
# This workflow must never use a production secret.

on:
  pull_request:
    paths: ["db/migrations/**", "scripts/migrate*.mjs", ".github/workflows/migrate-staging.yml"]
  push:
    branches: [main]
    paths: ["db/migrations/**", "scripts/migrate*.mjs", ".github/workflows/migrate-staging.yml"]
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.STAGING_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Check the secret is set
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Missing repository secret STAGING_DATABASE_URL_UNPOOLED (see SETUP.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show which migrations are pending
        run: npm run db:migrate -- --dry-run
      - name: Apply pending migrations
        run: npm run db:migrate
